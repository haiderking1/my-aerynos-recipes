name        : python-mutagen
version     : "1.48.1"
release     : 2
homepage    : https://github.com/quodlibet/mutagen
upstreams   :
    - https://github.com/quodlibet/mutagen/archive/refs/tags/release-1.48.1.tar.gz : 779f18015af1b28af59bd80c6292aa8151ca7e5fe6a36e17a394dda515981a5e
summary     : Python module to handle audio metadata
description : |
    Mutagen reads and writes audio metadata (ID3, Vorbis comments, MP4 tags, cover art...).
    yt-dlp needs it to embed thumbnails into .opus/.ogg files.
license     : GPL-2.0-or-later
builddeps   :
    - python(setuptools)
rundeps     :
    - python-libs
build       : |
    %pyproject_build
install     : |
    %pyproject_install
